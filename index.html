<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drive Gallery - Folders</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google API Scripts -->
    <script async defer src="https://apis.google.com/js/api.js"></script>
    <script async defer src="https://accounts.google.com/gsi/client"></script>
    <style>
        /* Custom scrollbar and animations */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1f2937; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #6b7280; }
        
        .gallery-item {
            transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
            aspect-ratio: 1 / 1;
        }
        .gallery-item:hover {
            transform: scale(1.03);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }

        /* Standard Grid Layout */
        .app-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 1rem;
        }
        @media (min-width: 640px) { .app-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
        @media (min-width: 768px) { .app-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
        @media (min-width: 1024px) { .app-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
        @media (min-width: 1280px) { .app-grid { grid-template-columns: repeat(6, minmax(0, 1fr)); } }

        .folder-icon-overlay {
            background: linear-gradient(to bottom, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.8) 100%);
        }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen font-sans antialiased overflow-x-hidden select-none">

    <!-- Navigation Bar -->
    <nav class="sticky top-0 z-40 bg-gray-900/90 backdrop-blur-md border-b border-gray-800 p-4">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="navigateTo('root', 'My Drive')">
                <div class="bg-blue-600 p-2 rounded-lg shadow-lg shadow-blue-500/30">
                    <i class="fa-solid fa-images text-xl"></i>
                </div>
                <h1 class="text-xl font-bold tracking-wide hidden sm:block">Gallery</h1>
            </div>
            
            <div class="flex items-center space-x-2 md:space-x-4">
                <span id="status-indicator" class="hidden sm:inline-flex items-center text-sm text-gray-400">
                    <span class="w-2 h-2 rounded-full bg-yellow-500 mr-2"></span> Demo
                </span>
                
                <!-- 정렬 설정 버튼 -->
                <button onclick="toggleSortModal()" class="text-gray-400 hover:text-white p-2 transition-colors rounded-full hover:bg-gray-800" title="정렬 설정">
                    <i class="fa-solid fa-arrow-down-wide-short text-lg"></i>
                </button>
                
                <button id="auth-btn" class="hidden bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-md text-sm font-medium transition-colors shadow-lg shadow-blue-600/20">
                    <i class="fa-brands fa-google mr-2"></i>Connect
                </button>
                <button id="logout-btn" class="hidden bg-gray-700 hover:bg-gray-600 text-white px-4 py-2 rounded-md text-sm font-medium transition-colors">
                    Disconnect
                </button>
                
                <button onclick="toggleSettingsModal()" class="text-gray-400 hover:text-white p-2 transition-colors rounded-full hover:bg-gray-800">
                    <i class="fa-solid fa-gear text-lg"></i>
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto p-4 py-6">
        <div id="breadcrumb-container" class="flex items-center space-x-2 text-sm md:text-base text-gray-300 mb-6 overflow-x-auto whitespace-nowrap pb-2 font-medium"></div>

        <div id="loading-spinner" class="hidden flex flex-col items-center justify-center py-20">
            <i class="fa-solid fa-circle-notch fa-spin text-4xl text-blue-500 mb-4"></i>
            <p class="text-gray-400 animate-pulse">Loading folders & photos...</p>
        </div>

        <div id="empty-state" class="hidden flex flex-col items-center justify-center py-20 text-center">
            <div class="bg-gray-800 p-6 rounded-full mb-4 shadow-inner">
                <i class="fa-regular fa-folder-open text-5xl text-gray-500"></i>
            </div>
            <h2 class="text-2xl font-semibold mb-2">Folder is empty</h2>
            <p class="text-gray-400 max-w-md">There are no photos or subfolders here.</p>
        </div>

        <div id="gallery-grid" class="app-grid"></div>
    </main>

    <!-- Lightbox Modal -->
    <div id="lightbox" class="fixed inset-0 z-50 hidden bg-black/95 flex items-center justify-center opacity-0 transition-opacity duration-300">
        <button onclick="closeLightbox()" class="absolute top-6 right-6 text-white/50 hover:text-white text-4xl p-2 z-50 transition-colors">
            <i class="fa-solid fa-xmark"></i>
        </button>
        <div class="relative w-full h-full flex items-center justify-center p-2 md:p-12">
            <img id="lightbox-img" src="" alt="Full view" class="max-w-full max-h-full object-contain rounded-md shadow-2xl">
            <div id="lightbox-caption" class="absolute bottom-8 left-0 right-0 text-center text-white bg-black/50 backdrop-blur-sm p-3 font-medium mx-auto max-w-fit rounded-full text-sm md:text-base"></div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="fixed inset-0 z-50 hidden bg-black/70 backdrop-blur-sm flex items-center justify-center opacity-0 transition-opacity duration-300 p-4">
        <div class="bg-gray-800 border border-gray-700 rounded-2xl shadow-2xl w-full max-w-md overflow-hidden transform scale-95 transition-transform duration-300" id="settings-content">
            <div class="p-6 border-b border-gray-700 flex justify-between items-center bg-gray-800/50">
                <h2 class="text-xl font-bold text-white"><i class="fa-solid fa-cloud-arrow-down mr-2 text-blue-400"></i>Drive Connect</h2>
                <button onclick="toggleSettingsModal()" class="text-gray-400 hover:text-white transition-colors"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <div class="p-6 space-y-5">
                <p class="text-sm text-gray-400">To view your actual Google Drive photos, please enter your API credentials.</p>
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-1.5">API Key</label>
                    <input type="text" id="api-key-input" placeholder="AIzaSy..." class="w-full bg-gray-900 border border-gray-600 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-1.5">OAuth Client ID</label>
                    <input type="text" id="client-id-input" placeholder="...apps.googleusercontent.com" class="w-full bg-gray-900 border border-gray-600 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all">
                </div>
            </div>
            <div class="p-5 border-t border-gray-700 bg-gray-900 flex justify-end space-x-3">
                <button onclick="toggleSettingsModal()" class="px-5 py-2.5 rounded-xl text-sm font-medium text-gray-400 hover:text-white hover:bg-gray-800 transition-colors">Cancel</button>
                <button onclick="saveSettings()" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-500 rounded-xl text-sm font-medium text-white shadow-lg shadow-blue-900/20 transition-colors">Save & Reload</button>
            </div>
        </div>
    </div>

    <!-- 정렬 설정 팝업(Modal) -->
    <div id="sort-modal" class="fixed inset-0 z-50 hidden bg-black/70 backdrop-blur-sm flex items-center justify-center opacity-0 transition-opacity duration-300 p-4">
        <div class="bg-gray-800 border border-gray-700 rounded-2xl shadow-2xl w-full max-w-md overflow-hidden transform scale-95 transition-transform duration-300" id="sort-content">
            <div class="p-6 border-b border-gray-700 flex justify-between items-center bg-gray-800/50">
                <h2 class="text-xl font-bold text-white"><i class="fa-solid fa-arrow-down-wide-short mr-2 text-blue-400"></i>정렬 설정</h2>
                <button onclick="toggleSortModal()" class="text-gray-400 hover:text-white transition-colors"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <div class="p-6 space-y-5">
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-1.5">정렬 방식</label>
                    <select id="sort-value-input" class="w-full bg-gray-900 border border-gray-600 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all">
                        <option value="folder, createdTime desc">⬇️ 최신순 (새로운 사진 먼저)</option>
                        <option value="folder, createdTime">⬆️ 과거순 (오래된 사진 먼저)</option>
                        <option value="folder, name">🔤 이름순 (A-Z)</option>
                        <option value="folder, name desc">🔤 이름 역순 (Z-A)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-1.5">적용 범위 설정</label>
                    <select id="sort-scope-input" class="w-full bg-gray-900 border border-gray-600 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all">
                        <option value="global">🌐 전체 폴더 기본값으로 적용</option>
                        <option value="this_only">📁 현재 폴더에만 임시 적용</option>
                        <option value="this_and_sub">📂 현재 폴더 및 하위 폴더 전체 적용</option>
                    </select>
                </div>
                <div class="flex justify-between items-center mt-2">
                    <button onclick="clearCurrentFolderSort()" class="text-sm text-red-400 hover:text-red-300 transition-colors underline decoration-red-400/50 underline-offset-4">현재 폴더의 개별 설정 초기화</button>
                </div>
            </div>
            <div class="p-5 border-t border-gray-700 bg-gray-900 flex justify-end space-x-3">
                <button onclick="toggleSortModal()" class="px-5 py-2.5 rounded-xl text-sm font-medium text-gray-400 hover:text-white hover:bg-gray-800 transition-colors">취소</button>
                <button onclick="applySortModal()" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-500 rounded-xl text-sm font-medium text-white shadow-lg shadow-blue-900/20 transition-colors">저장 및 적용</button>
            </div>
        </div>
    </div>

    <script>
        const DISCOVERY_DOC = 'https://www.googleapis.com/discovery/v1/apis/drive/v3/rest';
        const SCOPES = 'https://www.googleapis.com/auth/drive.readonly';
        
        let tokenClient;
        let gapiInited = false;
        let gisInited = false;
        let isConnected = false;
        
        let pathHistory = [{ id: 'root', name: 'My Drive' }];
        
        const authBtn = document.getElementById('auth-btn');
        const logoutBtn = document.getElementById('logout-btn');
        const galleryGrid = document.getElementById('gallery-grid');
        const loadingSpinner = document.getElementById('loading-spinner');
        const emptyState = document.getElementById('empty-state');
        const statusIndicator = document.getElementById('status-indicator');
        const breadcrumbContainer = document.getElementById('breadcrumb-container');

        const demoFileSystem = {
            'root': [{ id: 'img_1', type: 'image', name: 'Please Connect Drive', url: 'https://images.unsplash.com/photo-1516109923616-d3ce38be8610?w=800&q=80' }]
        };

        function initApp() {
            const apiKey = localStorage.getItem('drive_api_key');
            const clientId = localStorage.getItem('drive_client_id');

            if(apiKey) document.getElementById('api-key-input').value = apiKey;
            if(clientId) document.getElementById('client-id-input').value = clientId;

            if (apiKey && clientId) {
                statusIndicator.innerHTML = '<span class="w-2 h-2 rounded-full bg-blue-500 mr-2"></span> API Ready';
                authBtn.style.display = 'inline-flex';
                authBtn.onclick = handleAuthClick;
                logoutBtn.onclick = handleSignoutClick;
                
                gapiLoadPromise().then(gapiInit).catch(console.error);
                gisLoadPromise().then(gisInit).catch(console.error);
            } else {
                statusIndicator.innerHTML = '<span class="w-2 h-2 rounded-full bg-yellow-500 mr-2"></span> Demo Mode';
                authBtn.style.display = 'none';
                logoutBtn.style.display = 'none';
                loadCurrentFolder();
            }
        }

        function gapiLoadPromise() { return new Promise((r) => { if (typeof gapi !== 'undefined') r(); else window.onload = r; }); }
        function gisLoadPromise() { return new Promise((r) => { if (typeof google !== 'undefined' && google.accounts) r(); else setTimeout(r, 500); }); }

        function gapiInit() {
            gapi.load('client', async () => {
                try {
                    await gapi.client.init({
                        apiKey: localStorage.getItem('drive_api_key'),
                        discoveryDocs: [DISCOVERY_DOC],
                    });
                    gapiInited = true;

                    const savedToken = localStorage.getItem('gapi_token');
                    if (savedToken) {
                        gapi.client.setToken(JSON.parse(savedToken));
                        isConnected = true;
                        authBtn.style.display = 'none';
                        logoutBtn.style.display = 'inline-flex';
                        statusIndicator.innerHTML = '<span class="w-2 h-2 rounded-full bg-green-500 mr-2"></span> Connected';
                        loadCurrentFolder(); 
                    }

                    maybeEnableButtons();
                } catch (err) { 
                    console.error("API Init Error:", err);
                    alert('API Init Error. Check API Key.'); 
                }
            });
        }

        function gisInit() {
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: localStorage.getItem('drive_client_id'),
                scope: SCOPES,
                callback: '',
            });
            gisInited = true;
            maybeEnableButtons();
        }

        function maybeEnableButtons() { if (gapiInited && gisInited) authBtn.disabled = false; }

        function handleAuthClick() {
            tokenClient.callback = async (resp) => {
                if (resp.error) throw (resp);
                localStorage.setItem('gapi_token', JSON.stringify(gapi.client.getToken()));

                authBtn.style.display = 'none';
                logoutBtn.style.display = 'inline-flex';
                statusIndicator.innerHTML = '<span class="w-2 h-2 rounded-full bg-green-500 mr-2"></span> Connected';
                isConnected = true;
                pathHistory = [{ id: 'root', name: 'My Drive' }];
                loadCurrentFolder();
            };
            if (gapi.client.getToken() === null) tokenClient.requestAccessToken({prompt: 'consent'});
            else tokenClient.requestAccessToken({prompt: ''});
        }

        function handleSignoutClick() {
            const token = gapi.client.getToken();
            if (token) {
                google.accounts.oauth2.revoke(token.access_token);
                gapi.client.setToken('');
                localStorage.removeItem('gapi_token');
                isConnected = false;
                authBtn.style.display = 'inline-flex';
                logoutBtn.style.display = 'none';
                statusIndicator.innerHTML = '<span class="w-2 h-2 rounded-full bg-blue-500 mr-2"></span> API Ready';
                galleryGrid.innerHTML = '';
                emptyState.style.display = 'flex';
                breadcrumbContainer.innerHTML = '';
            }
        }

        function getSortPreference() {
            try {
                const currentFolderId = pathHistory[pathHistory.length - 1].id;
                const prefs = JSON.parse(localStorage.getItem('folder_sort_prefs') || '{}');
                
                if (prefs[currentFolderId]) return prefs[currentFolderId].value;
                
                for (let i = pathHistory.length - 2; i >= 0; i--) {
                    const fid = pathHistory[i].id;
                    if (prefs[fid] && prefs[fid].scope === 'this_and_sub') return prefs[fid].value;
                }
                
                const globalSort = localStorage.getItem('global_sort');
                if (globalSort) return globalSort;
            } catch (e) { console.error(e); }
            return 'folder, createdTime desc'; 
        }

        // 🔽 즐겨찾기(고정) 토글 및 상태 관리 함수 🔽
        function togglePin(event, id) {
            event.stopPropagation(); // 카드 클릭(폴더 열기/라이트박스) 방지
            try {
                let pinned = JSON.parse(localStorage.getItem('pinned_items') || '[]');
                if (pinned.includes(id)) {
                    pinned = pinned.filter(item => item !== id);
                } else {
                    pinned.push(id);
                }
                localStorage.setItem('pinned_items', JSON.stringify(pinned));
                loadCurrentFolder(); // 목록 새로고침
            } catch (e) { console.error(e); }
        }

        const sortModal = document.getElementById('sort-modal');
        const sortContent = document.getElementById('sort-content');

        function toggleSortModal() {
            if (sortModal.classList.contains('hidden')) {
                const currentFolderId = pathHistory[pathHistory.length - 1].id;
                const prefs = JSON.parse(localStorage.getItem('folder_sort_prefs') || '{}');
                
                if (prefs[currentFolderId]) {
                    document.getElementById('sort-value-input').value = prefs[currentFolderId].value;
                    document.getElementById('sort-scope-input').value = prefs[currentFolderId].scope;
                } else {
                    document.getElementById('sort-value-input').value = getSortPreference();
                    document.getElementById('sort-scope-input').value = 'global';
                }

                sortModal.classList.remove('hidden');
                void sortModal.offsetWidth;
                sortModal.classList.remove('opacity-0');
                sortContent.classList.remove('scale-95');
            } else {
                sortModal.classList.add('opacity-0');
                sortContent.classList.add('scale-95');
                setTimeout(() => sortModal.classList.add('hidden'), 300);
            }
        }

        function applySortModal() {
            const value = document.getElementById('sort-value-input').value;
            const scope = document.getElementById('sort-scope-input').value;
            const currentFolderId = pathHistory[pathHistory.length - 1].id;

            if (scope === 'global') {
                localStorage.setItem('global_sort', value);
                const prefs = JSON.parse(localStorage.getItem('folder_sort_prefs') || '{}');
                delete prefs[currentFolderId];
                localStorage.setItem('folder_sort_prefs', JSON.stringify(prefs));
            } else {
                const prefs = JSON.parse(localStorage.getItem('folder_sort_prefs') || '{}');
                prefs[currentFolderId] = { value: value, scope: scope };
                localStorage.setItem('folder_sort_prefs', JSON.stringify(prefs));
            }

            toggleSortModal();
            if (isConnected) loadCurrentFolder(); 
        }

        function clearCurrentFolderSort() {
            const currentFolderId = pathHistory[pathHistory.length - 1].id;
            const prefs = JSON.parse(localStorage.getItem('folder_sort_prefs') || '{}');
            
            if (prefs[currentFolderId]) {
                delete prefs[currentFolderId];
                localStorage.setItem('folder_sort_prefs', JSON.stringify(prefs));
                toggleSortModal();
                if (isConnected) loadCurrentFolder();
            } else {
                alert("이 폴더에는 지정된 개별 정렬 설정이 없습니다.");
            }
        }

        function navigateTo(id, name) {
            const index = pathHistory.findIndex(p => p.id === id);
            if (index !== -1) {
                pathHistory = pathHistory.slice(0, index + 1);
            } else {
                pathHistory.push({ id, name });
            }
            loadCurrentFolder();
        }

        function renderBreadcrumbs() {
            breadcrumbContainer.innerHTML = '';
            pathHistory.forEach((crumb, index) => {
                const isLast = index === pathHistory.length - 1;
                const span = document.createElement('span');
                span.className = `flex items-center ${isLast ? 'text-white font-bold' : 'text-gray-400 hover:text-blue-400 cursor-pointer transition-colors'}`;
                
                let icon = index === 0 ? '<i class="fa-brands fa-google-drive mr-2"></i>' : '';
                span.innerHTML = `${icon}${crumb.name}`;
                if(!isLast) span.onclick = () => navigateTo(crumb.id, crumb.name);
                breadcrumbContainer.appendChild(span);
                
                if (!isLast) {
                    const separator = document.createElement('i');
                    separator.className = 'fa-solid fa-chevron-right text-xs mx-3 text-gray-600';
                    breadcrumbContainer.appendChild(separator);
                }
            });
        }

        async function loadCurrentFolder() {
            const currentFolder = pathHistory[pathHistory.length - 1];
            renderBreadcrumbs();
            showLoading();
            
            const activeSort = getSortPreference();

            if (isConnected) {
                await fetchDriveItems(currentFolder.id, activeSort);
            } else {
                setTimeout(() => {
                    renderItems(demoFileSystem[currentFolder.id] || []);
                }, 500);
            }
        }

        async function fetchDriveItems(folderId, activeSort) {
            try {
                let imageSortOrder = activeSort.replace('folder,', '').trim();
                if (!imageSortOrder) imageSortOrder = 'createdTime desc';

                const response = await gapi.client.drive.files.list({
                    pageSize: 1000,
                    fields: 'files(id, name, mimeType, thumbnailLink)',
                    q: `'${folderId}' in parents and trashed = false and (mimeType contains 'image/' or mimeType = 'application/vnd.google-apps.folder')`,
                    orderBy: activeSort 
                });

                const rawFiles = response.result.files || [];
                let formattedItems = rawFiles.map(f => {
                    const isFolder = f.mimeType === 'application/vnd.google-apps.folder';
                    return {
                        id: f.id,
                        name: f.name,
                        type: isFolder ? 'folder' : 'image',
                        fullUrl: f.thumbnailLink ? f.thumbnailLink.replace(/=s\d+$/, '=s0') : null,
                        thumbUrl: f.thumbnailLink ? f.thumbnailLink.replace(/=s\d+$/, '=w500') : null
                    };
                });

                // 이름순 정렬 시 숫자 자연 정렬 적용
                if (activeSort.includes('name')) {
                    const isDesc = activeSort.includes('desc');
                    formattedItems.sort((a, b) => {
                        if (a.type !== b.type) return a.type === 'folder' ? -1 : 1;
                        const compareResult = a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' });
                        return isDesc ? -compareResult : compareResult;
                    });
                }

                // 🔽 [핵심] 고정(즐겨찾기)된 항목을 무조건 맨 위로 강제 정렬 🔽
                const pinnedIds = JSON.parse(localStorage.getItem('pinned_items') || '[]');
                formattedItems.sort((a, b) => {
                    const aPinned = pinnedIds.includes(a.id);
                    const bPinned = pinnedIds.includes(b.id);
                    if (aPinned && !bPinned) return -1; // a가 고정되어 있으면 위로
                    if (!aPinned && bPinned) return 1;  // b가 고정되어 있으면 위로
                    return 0; // 둘 다 상태가 같으면 기존 정렬 유지
                });
                
                await renderItems(formattedItems, imageSortOrder);
                
                formattedItems.filter(i => i.type === 'folder').forEach(folder => {
                    fetchFolderCoverAsync(folder.id, imageSortOrder);
                });

            } catch (err) {
                console.error(err);
                if (err && err.status === 401) {
                    handleSignoutClick();
                    alert("인증이 만료되었습니다. 다시 Connect를 눌러주세요.");
                } else {
                    alert("Error fetching Drive data.");
                }
                hideLoading();
            }
        }

        async function fetchFolderCoverAsync(folderId, imageSortOrder = 'createdTime desc') {
            if(!isConnected) return;
            try {
                const res = await gapi.client.drive.files.list({
                    pageSize: 1,
                    fields: 'files(thumbnailLink)',
                    q: `'${folderId}' in parents and mimeType contains 'image/' and trashed = false`,
                    orderBy: imageSortOrder
                });
                if (res.result.files && res.result.files.length > 0) {
                    const coverUrl = res.result.files[0].thumbnailLink.replace(/=s\d+$/, '=w500');
                    const imgEl = document.getElementById(`cover-${folderId}`);
                    if(imgEl) {
                        imgEl.src = coverUrl;
                        imgEl.classList.remove('opacity-0');
                    }
                }
            } catch(e) {}
        }

        function renderItems(items) {
            galleryGrid.innerHTML = '';
            if (!items || items.length === 0) {
                showEmpty();
                return;
            }
            
            const pinnedIds = JSON.parse(localStorage.getItem('pinned_items') || '[]');

            items.forEach(item => {
                const isPinned = pinnedIds.includes(item.id);
                const card = document.createElement('div');
                card.className = 'gallery-item relative rounded-2xl overflow-hidden cursor-pointer group bg-gray-800 border border-gray-700 shadow-md';
                
                // 고정(즐겨찾기) 버튼 HTML (우측 상단 별모양)
                const pinButtonHtml = `
                    <button onclick="togglePin(event, '${item.id}')" class="absolute top-2 right-2 z-20 p-2 rounded-full bg-black/40 hover:bg-black/70 backdrop-blur-sm text-white transition-all ${isPinned ? 'text-yellow-400 opacity-100' : 'opacity-0 group-hover:opacity-100'}">
                        <i class="fa-${isPinned ? 'solid' : 'regular'} fa-star text-sm drop-shadow"></i>
                    </button>
                `;

                if (item.type === 'folder') {
                    const coverUrl = isConnected ? '' : (item.cover || '');
                    card.innerHTML = `
                        ${pinButtonHtml}
                        <div class="absolute inset-0 bg-gray-700 flex items-center justify-center">
                            <i class="fa-solid fa-folder text-4xl text-gray-500"></i>
                        </div>
                        <img id="cover-${item.id}" src="${coverUrl}" class="absolute inset-0 w-full h-full object-cover transition-transform duration-500 group-hover:scale-110 ${coverUrl ? '' : 'opacity-0'}" loading="lazy">
                        <div class="absolute inset-0 folder-icon-overlay"></div>
                        <div class="absolute bottom-0 left-0 right-0 p-3 flex items-center">
                            <i class="fa-solid fa-folder text-blue-400 mr-2 drop-shadow-md"></i>
                            <span class="text-white font-medium truncate drop-shadow-md text-sm md:text-base">${item.name}</span>
                        </div>
                    `;
                    card.onclick = () => navigateTo(item.id, item.name);
                } else {
                    const thumbUrl = item.thumbUrl || item.url;
                    const fullUrl = item.fullUrl || item.url;
                    card.innerHTML = `
                        ${pinButtonHtml}
                        <img src="${thumbUrl}" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110" loading="lazy" alt="${item.name}">
                    `;
                    card.onclick = () => openLightbox(fullUrl, item.name);
                }
                galleryGrid.appendChild(card);
            });
            hideLoading();
        }

        function showLoading() {
            loadingSpinner.style.display = 'flex';
            galleryGrid.style.display = 'none';
            emptyState.style.display = 'none';
        }

        function hideLoading() {
            loadingSpinner.style.display = 'none';
            galleryGrid.style.display = 'grid'; 
        }

        function showEmpty() {
            loadingSpinner.style.display = 'none';
            galleryGrid.style.display = 'none';
            emptyState.style.display = 'flex';
        }

        const settingsModal = document.getElementById('settings-modal');
        const settingsContent = document.getElementById('settings-content');
        
        function toggleSettingsModal() {
            if (settingsModal.classList.contains('hidden')) {
                settingsModal.classList.remove('hidden');
                void settingsModal.offsetWidth;
                settingsModal.classList.remove('opacity-0');
                settingsContent.classList.remove('scale-95');
            } else {
                settingsModal.classList.add('opacity-0');
                settingsContent.classList.add('scale-95');
                setTimeout(() => settingsModal.classList.add('hidden'), 300);
            }
        }

        function saveSettings() {
            const apiKey = document.getElementById('api-key-input').value.trim();
            const clientId = document.getElementById('client-id-input').value.trim();
            if(apiKey) localStorage.setItem('drive_api_key', apiKey);
            else localStorage.removeItem('drive_api_key');
            if(clientId) localStorage.setItem('drive_client_id', clientId);
            else localStorage.removeItem('drive_client_id');
            
            toggleSettingsModal();
            setTimeout(() => window.location.reload(), 300); 
        }

        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const lightboxCaption = document.getElementById('lightbox-caption');

        function openLightbox(url, title) {
            lightboxImg.src = url;
            lightboxCaption.textContent = title;
            lightbox.classList.remove('hidden');
            void lightbox.offsetWidth;
            lightbox.classList.remove('opacity-0');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            lightbox.classList.add('opacity-0');
            setTimeout(() => {
                lightbox.classList.add('hidden');
                lightboxImg.src = '';
                document.body.style.overflow = 'auto';
            }, 300);
        }

        lightbox.addEventListener('click', (e) => {
            if(e.target === lightbox || e.target.classList.contains('relative')) closeLightbox();
        });
        
        document.addEventListener('keydown', (e) => {
            if(e.key === 'Escape' && !lightbox.classList.contains('hidden')) closeLightbox();
        });

        function initPWA() {
            const manifest = {
                name: "Drive Gallery",
                short_name: "Gallery",
                display: "standalone",
                background_color: "#111827",
                theme_color: "#1f2937",
                icons: [{
                    src: "https://cdn-icons-png.flaticon.com/512/2916/2916118.png", 
                    sizes: "512x512",
                    type: "image/png"
                }]
            };
            const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
            const manifestUrl = URL.createObjectURL(manifestBlob);
            const link = document.createElement('link');
            link.rel = 'manifest';
            link.href = manifestUrl;
            document.head.appendChild(link);

            if ('serviceWorker' in navigator) {
                const swCode = `
                    const CACHE_NAME = 'drive-gallery-v2';
                    self.addEventListener('install', event => {
                        event.waitUntil(caches.open(CACHE_NAME).then(cache => {
                            return cache.addAll([ location.href, 'https://cdn.tailwindcss.com', 'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css' ]);
                        }));
                        self.skipWaiting();
                    });
                    self.addEventListener('activate', event => { event.waitUntil(clients.claim()); });
                    self.addEventListener('fetch', event => {
                        const url = new URL(event.request.url);
                        event.respondWith(
                            caches.match(event.request).then(cachedResponse => {
                                if (cachedResponse) {
                                    fetch(event.request).then(networkResponse => {
                                        caches.open(CACHE_NAME).then(cache => { cache.put(event.request, networkResponse.clone()); });
                                    }).catch(() => {});
                                    return cachedResponse;
                                }
                                return fetch(event.request).then(networkResponse => {
                                    if(!url.hostname.includes('apis.google.com') && !url.hostname.includes('accounts.google.com')) {
                                        const responseToCache = networkResponse.clone();
                                        caches.open(CACHE_NAME).then(cache => { cache.put(event.request, responseToCache); });
                                    }
                                    return networkResponse;
                                }).catch(() => { console.log("Offline mode"); });
                            })
                        );
                    });
                `;
                const swBlob = new Blob([swCode], { type: 'application/javascript' });
                const swUrl = URL.createObjectURL(swBlob);
                navigator.serviceWorker.register(swUrl).catch(err => console.error(err));
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            initPWA();
            initApp();
        });
    </script>
</body>
</html>
